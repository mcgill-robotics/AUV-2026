# not the standard ROS node config parameters, these are topics passed to the vision pipeline launch file
camera:
  # inputs to the vision pipeline
  front_cam_topic: /zed/zed_node/rgb/color/rect/image 
  down_cam_topic: /down_cam/image_raw

image_enhancement:
  front_cam: 
    enhanced_topic: /vision/front_cam/image_enhanced # output topic
    queue_size: 10 # QOL queue size, how many messages to buffer if the node can't process them fast enough
    log_level: warn # ros2 log level for the image enhancement node [debug, info, warn, error, fatal]
  down_cam:
    enhanced_topic: /vision/down_cam/image_enhanced
    queue_size: 10
    log_level: warn

object_detection:
  front_cam:
    # Topics / model
    enable_object_detection: true
    enhanced_topic: /vision/front_cam/image_enhanced # input topic if enhance_images is true, otherwise will subscribe to raw image topic
    detection_frame_topic: /vision/front_cam/detection_frame # synchronized camera-frame detections + AUV pose
    model_relative_path: models/local_rfdetr_onnx_test # inference-models package directory
    class_names:
      - "gate"
      - "lane_marker"
      - "red_pipe"
      - "white_pipe"
      - "octagon"
      - "table"
      - "bin"
      - "board"
      - "survey_repair"
      - "search_rescue"
      - "compass"
      - "tools"
      - "lifebuoy"
      - "sos"
      - "ambulance"
      - "firetruck"
      - "blood"
      - "fire"
      - "bin_structure"
    queue_size: 10
    model_detection_threshold: 0.40

    # ZED init parameters
    zed_camera_resolution_sim: SVGA # init-time resolution for Unity/stream input
    zed_camera_resolution_real: VGA # wrapper-aligned starting point for the real ZED 2i
    zed_camera_fps_sim: 30 # init-time FPS for Unity/stream input
    zed_camera_fps_real: 30 # init-time FPS for the real ZED 2i
    zed_camera_flip_mode: 'OFF' # OFF, ON, or AUTO
    zed_self_calib: false # wrapper-aligned default
    zed_enable_right_side_measure: false # keep left-aligned processing only
    zed_sdk_verbose: 1 # wrapper-aligned SDK verbosity
    zed_sdk_gpu_id: -1 # let the SDK choose the GPU
    zed_enable_image_enhancement: true # wrapper-aligned enhanced contrast setting
    zed_open_timeout_sec: 5.0 # wrapper-aligned open timeout
    zed_async_grab_camera_recovery: false # keep grab() blocking until communication is restored
    zed_grab_compute_capping_fps: 0.0 # wrapper-aligned compute cap; 0 disables capping
    zed_enable_image_validity_check: false # wrapper-aligned frame corruption check
    zed_optional_opencv_calibration_file: '' # optional OpenCV override for factory calibration
    zed_depth_stabilization: 30 # init-time ZED depth stabilization; forced to 0 when enable_vio is false to avoid implicit tracking enablement
    zed_depth_minimum_distance: 0.01 # minimum depth range in meters used by the ZED SDK
    zed_depth_maximum_distance: 20.0 # maximum depth range in meters used by the ZED SDK

    # ZED runtime depth / tracking controls
    depth_confidence_threshold: 95 # ZED runtime confidence threshold used for depth/3D extraction
    zed_positional_tracking_depth_min_range: 0.3 # minimum range in meters used by ZED positional tracking

    # ZED runtime image / ISP controls
    zed_brightness: 4 # wrapper-aligned ZED 2i starting point [0..8]
    zed_contrast: 4 # wrapper-aligned ZED 2i starting point [0..8]
    zed_hue: 0 # wrapper-aligned ZED 2i starting point [0..11]
    zed_saturation: 4 # wrapper-aligned common stereo starting point [0..8]
    zed_sharpness: 4 # wrapper-aligned common stereo starting point [0..8]
    zed_gamma: 8 # wrapper-aligned common stereo starting point [1..9]
    zed_auto_exposure_gain: false # wrapper-aligned default; when true the manual gain/exposure values are ignored
    zed_exposure: 25 # wrapper-aligned common stereo starting point [0..100] when auto exposure/gain is disabled
    zed_gain: 80 # wrapper-aligned common stereo starting point [0..100] when auto exposure/gain is disabled
    zed_auto_whitebalance: true # wrapper-aligned default; when true the manual white balance temperature is ignored
    zed_whitebalance_temperature: 2800 # Affected value should be between 2800 and 6500 with a step of 100.
                                       # Setting a value will automatically set WHITEBALANCE_AUTO to 0. 
    zed_led_status: -1 # -1 leaves the SDK/camera default unchanged; otherwise 0 off, 1 on

    # Pose / frame sync
    enable_vio: true # if false, skip ZED positional tracking and do not publish vision VIO pose/TF
    pose_source: zed_vio # auv_pose uses state/pose for synchronized detection frames; zed_vio uses the front ZED VIO estimate
    auv_pose_topic: state/pose # official aggregated AUV pose used for synchronized detection frames when pose_source=auv_pose
    vio_pose_topic: /vision/vio_pose # optional vision VIO measurement output for debugging or future fusion
    broadcast_vio_tf: true # if VIO is enabled, publish pool_link -> auv_vio_link for visualization/debugging
    global_frame_id: pool_link # world frame for synchronized AUV poses and mapped objects
    auv_frame_id: auv_link # official body frame; sensors/state estimation should own pool_link -> auv_link
    vio_frame_id: auv_vio_link # debug-only VIO child frame published by vision when enabled

    # Frame names / camera extrinsics
    camera_center_frame_id: zed_camera_center # static camera mount frame under auv_link
    detection_frame_id: zed_left_camera_frame # 3D detection frame used inside VisionDetectionFrame
    image_frame_id: zed_left_camera_frame_optical # optical frame for image-like topics such as CameraInfo and debug feeds
    auv_to_camera_center_xyz: [0.148, 0.0, 0.0]
    auv_to_camera_center_rpy: [0.0, 0.0, 0.0]
    camera_center_to_detection_xyz: [0.0, 0.06, 0.0]
    camera_center_to_detection_rpy: [0.0, 0.0, 0.0]

    # Detection-time filters / heuristics
    enable_gate_top_crop: true # Removes bottom X% of bounding box for gate to ignore legs/pool floor noise
    gate_top_crop_ratio: 0.50 # The ratio (0.0 to 1.0) of the gate bounding box to keep from the top edge
    enable_border_exclusion: false
    border_exclusion_margin_px: 20
    border_exclusion_labels: ["gate"]

    # Debug publishing
    publish_camera_info: true # publish CameraInfo for the front camera feed using ZED left-camera intrinsics
    publish_annotated_image: true # publishes the front camera feed topic at detection_frame_topic + /annotated, toggled raw/annotated at runtime via service
    publish_annotated_every_n_frames: 1 # publish the front camera feed every N frames (1 = every frame)
    publish_depth_image: false # publish raw 32FC1 depth map image
    publish_depth_compressed: false # publish depth map as compressed 16-bit PNG
    publish_depth_every_n_frames: 5 # publish depth image every N frames

    # Dataset collection
    collection_dir: front_cam_collection # directory for direct-to-disk RGB image saving (toggled via service)
    depth_collection_dir: depth_collection # directory for direct-to-disk 16-bit millimeter depth saving
    collect_depth_image: false # flag to enable/disable depth saving
    collection_interval_seconds: 2.0 # seconds between saved frames when collection is active

    # Logging
    log_level: debug
  down_cam:
    # Camera hardware (direct capture via cv2.VideoCapture, no usb_cam_node needed)
    # ELP-USB500W02M-AF60 (5MP OV5640, autofocus, 60° FOV)
    # Available MJPEG modes:   640x480@30  800x600@30  1024x768@30  1280x720@30  1280x1024@15  1600x1200@15  1920x1080@15  2592x1944@15
    # Available YUY2 modes:    640x480@30  800x600@30  1024x768@15  1280x720@7.5 1280x1024@7.5 1600x1200@3   1920x1080@3   2592x1944@3
    video_device: "/dev/down_cam"
    image_width: 640
    image_height: 480
    camera_fps: 30
    camera_frame_id: "sensors/down_cam"

    # V4L2 image controls (ELP OV5640)
    # Run `v4l2-ctl -d /dev/videoX --all` on the Jetson with the camera plugged in to verify ranges
    # v4l2-ctl --list-devices 
    # v4l2-ctl -d /dev/video2 --all
    # v4l2-ctl -d /dev/video2 --list-formats-ext

    brightness: 8              # [0..15]    default 8
    contrast: 8                # [0..15]    default 8
    saturation: 7              # [0..15]    default 7
    hue: 0                     # [-10..10]  default 0
    sharpness: 6               # [0..15]    default 6
    gamma: 7                   # [1..10]    default 7
    backlight_compensation: 0  # [0..1]     default 0
    power_line_frequency: 2    # 0=disabled 1=50Hz 2=60Hz; default 2

    # White balance
    auto_white_balance: false            # default true; when true, white_balance_temperature is ignored
    white_balance_temperature: 4500      # [2800..6500] step 1; only used when auto_white_balance is false

    # Exposure & focus
    auto_exposure: 1                     # 1=Manual 3=Aperture Priority (auto); default 3
    exposure_time_absolute: 40           # [4..5000]  only used when auto_exposure is 1 (Manual); default 625
    auto_focus: false                    # default true; when true, focus_absolute is ignored
    focus_absolute: 7                    # [0..21]    only used when auto_focus is false; default 16

    enable_object_detection: true
    enhanced_topic: /vision/down_cam/image_enhanced
    detection_topic: /vision/down_cam/detections
    model_detection_threshold: 0.40
    # relative to src directory
    model_relative_path: models/local_rfdetr_onnx_test # inference-models package directory (TODO: create this package)
    class_names:
      - "gate"
      - "lane_marker"
      - "red_pipe"
      - "white_pipe"
      - "octagon"
      - "table"
      - "bin"
      - "board"
      - "survey_repair"
      - "search_rescue"
      - "compass"
      - "tools"
      - "lifebuoy"
      - "sos"
      - "ambulance"
      - "firetruck"
      - "blood"
      - "fire"
      - "bin_structure"
    queue_size: 10
    publish_annotated_image: true
    publish_annotated_every_n_frames: 1
    collection_dir: down_cam_collection
    collection_interval_seconds: 2.0
    log_level: info

object_map:
  map_topic: /vision/object_map # final output of vision pipeline
  new_object_min_distance_threshold: 0.5 # distance in meters between a new detection and existing tracks to be considered a new object and start a new track
  large_structure_labels: ["gate", "table", "board", "bin_structure"]
  pipe_labels: ["red_pipe", "white_pipe"]
  min_large_structure_separation_m: 2.0 # minimum XY spacing required before spawning gate/table/board/bin_structure near another confirmed large structure
  min_large_structure_pipe_separation_m: 1.0 # minimum XY spacing required before spawning gate/table/board/bin_structure near a confirmed pipe

  # Feature Toggles (Game-Specific Constraints)
  enable_z_axis_locking: true # Forces specific unique objects to snap to pool floor/surface Z coordinates
  enable_gate_midpoint_refinement: true # Uses search_rescue/survey_repair panel detections to refine the gate pose
  enable_board_icon_refinement: true # Uses board icons to refine the board pose and make yaw face the AUV
  enable_octagon_from_table_xy: false # publish-time only: publish the octagon at the table XY and suppress direct octagon output
  enable_table_from_octagon_xy: false # publish-time only: publish the table at the octagon XY and suppress direct table output
  enable_table_octagon_xy_midpoint: true # publish-time only: publish both at the shared midpoint XY; if only one is seen, use that XY for both
  # Only one of the three table/octagon publish modes should be enabled at a time; object_map will fail fast if multiple are true.
  max_pipe_distance: 7.0 # Truncates tracking of red/white pipes beyond this distance to reduce noise in map
  enable_lane_boundary: false # discard world-frame detections outside the competition lane AABB
  lane_x_min: -3.0 # back boundary (meters, world frame)
  lane_x_max: 25.0  # front boundary
  lane_y_min: -15.0 # right boundary
  lane_y_max: 15.0  # left boundary
  pool_floor_z: -2.1
  pool_surface_z: 0.0
  unique_objects: ["gate", "bin_structure", "table", "board", "octagon"]
  floor_objects: ["bin_structure", "table", "lane_marker", "board"]
  surface_objects: ["gate", "octagon"]

  max_per_class:
    gate: 1
    board: 1
    octagon: 1
    table: 1
    bin_structure: 1
    lane_marker: 2
    white_pipe: 6
    red_pipe: 3
    bin: 4
    search_rescue: 1
    survey_repair: 1
    compass: 1
    tools: 1
    lifebuoy: 1
    sos: 1
    ambulance: 1
    firetruck: 1
    blood: 1
    fire: 1

  # Tracker Parameters
  # relatively strict
  gating_threshold: 3.5 # Mahalanobis distance threshold (~3 sigma) for associating detections to tracks
  min_hits: 20 # Consecutive frames a detection must be matched to confirm a new track
  max_age: 8 # Number of frames to keep a lost track alive before deleting it
  max_position_jump: 2.0 # Maximum allowed distance (meters) between predictions and measurements
  conf_to_tent_threshold: 5 # Number of consecutive missed frames before a CONFIRMED track degrades to TENTATIVE
  tent_init_buffer: 5 # Extra frames allowed for a new TENTATIVE track to initialize before being deleted if unmatched
  
  # loose parameters
  # gating_threshold: 5.0
  # min_hits: 5
  # max_age: 15
  # max_position_jump: 4.0
  # conf_to_tent_threshold: 10
  # tent_init_buffer: 10

  # raw detection parameters
  # gating_threshold: 99.0
  # min_hits: 1
  # max_age: 1
  # max_position_jump: 99.0
  # conf_to_tent_threshold: 1
  # tent_init_buffer: 1

  # Debug
  log_level: warn

general:
  # sim is what the wrapper listens to (the Unity sim stream), stream is what the wrapper republishes as a ROS topic for the rest of the vision pipeline to use
  # whether to use the ZED wrapper in simulation mode (true) or with a real camera (false)
  sim: false
  sim_ip: "127.0.0.1"
  sim_port: 30000
  # whether to use the wrapper as a streaming server that multiple nodes can subscribe to
  use_wrapper_stream: true
  wrapper_stream_ip: "127.0.1.1"
  wrapper_stream_port: 30000
  zed_wrapper_log_type: "log" # log, screen, or both
  compressed: true
  enhance_images: false
