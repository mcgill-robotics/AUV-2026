front_cam_object_detection:
  ros__parameters:
    enable_object_detection: true
    # input / output topics
    topics:
      image: /zed/zed_node/rgb/color/rect/image # this will be the input topic if sim=true and no zed sdk is available, this will be set to front_image_enhancement.ros__parameters.output_topic if enhance_images is set to true
      detection_frame: /vision/front_cam/detection_frame # synchronized camera-frame detections + A
    has_zed_sdk: true
    model:
      relative_path: models/local_rfdetr_onnx_test # inference-models package directory
      # WARNING: These class names MUST be manually maintained when changing models to have new classes. 
      # You must also update the `class_names.txt` file in the model package.
      # A mismatch here can crash the vision node.
      class_names:
        - "gate"
        - "lane_marker"
        - "red_pipe"
        - "white_pipe"
        - "octagon"
        - "table"
        - "bin"
        - "board"
        - "survey_repair"
        - "search_rescue"
        - "compass"
        - "tools"
        - "lifebuoy"
        - "sos"
        - "ambulance"
        - "firetruck"
        - "blood"
        - "fire"
        - "bin_structure"
      detection_threshold: 0.40
    qos:
      queue_size: 10
    # ZED SDK parameters
    zed:
      resolution:
        sim: SVGA # resolution for Unity/stream input
        real: VGA # wrapper-aligned starting point for the real ZED 2i
      fps:
        sim: 30 # FPS for Unity/stream input
        real: 30 # FPS for the real ZED 2i
      flip_mode: 'OFF' # OFF, ON, or AUTO
      self_calib: false # wrapper-aligned default
      enable_right_side_measure: false # keep left-aligned processing only
      sdk_verbose: 1 # wrapper-aligned SDK verbosity
      sdk_gpu_id: -1 # let the SDK choose the GPU
      enable_image_enhancement: true # wrapper-aligned enhanced contrast setting
      open_timeout_sec: 5.0 # wrapper-aligned open timeout
      async_grab_camera_recovery: false # keep grab() blocking until communication is restored
      grab_compute_capping_fps: 0.0 # wrapper-aligned compute cap; 0 disables capping
      enable_image_validity_check: false # wrapper-aligned frame corruption check
      optional_opencv_calibration_file: '' # optional OpenCV override for factory calibration
      depth:
        stabilization: 30 # init-time ZED depth stabilization; forced to 0 when enable_vio is false to avoid implicit tracking enablement
        mode: NEURAL # NEURAL or NEURAL_PLUS
        minimum_distance: 0.2 # minimum depth range in meters used by the ZED SDK
        maximum_distance: 20.0 # maximum depth range in meters used by the ZED SDK
        confidence_threshold: 95 # ZED SDK confidence threshold for depth measurements (0-100)
        positional_tracking_min_range: 0.3 # minimum range in meters used by ZED positional tracking
      # ZED runtime image / ISP controls
      image:
        brightness: 4 # wrapper-aligned ZED 2i starting point [0..8]
        contrast: 4 # wrapper-aligned ZED 2i starting point [0..8]
        hue: 0 # wrapper-aligned ZED 2i starting point [0..11]
        saturation: 4 # wrapper-aligned common stereo starting point [0..8]
        sharpness: 4 # wrapper-aligned common stereo starting point [0..8]
        gamma: 8 # wrapper-aligned common stereo starting point [1..9]
        gain: 80 # wrapper-aligned common stereo starting point [0..100] when exposure.auto is false
        exposure:
          auto: false # wrapper-aligned default; when true the manual gain/exposure values are ignored
          value: 25 # wrapper-aligned common stereo starting point [0..100] when exposure.auto is false
        white_balance:
          auto: true # wrapper-aligned default; when true the manual white balance temperature is ignored
          temperature: 2800 # Affected value should be between 2800 and 6500 with a step of 100. 
                                       # Setting a value will automatically set WHITEBALANCE_AUTO to 0. 
        led_status: -1 # -1 leaves the SDK/camera default

    # Positional tracking and pose publication parameters
    pose:
      source: auv_pose # auv_pose uses state/pose for synchronized detection frames; zed_vio uses the front ZED VIO estimate
      auv:
        topic: state/pose # official aggregated AUV pose used for synchronized detection frames when pose_source=auv_pose
      vio:
        enable: false # if false, skip ZED positional tracking and do not publish vision VIO pose/TF
        topic: /vision/vio_pose # optional topic for publishing the ZED VIO pose estimate; only used if pose.vio.enable is true
        broadcast_tf: true # if true and pose.vio.enable is true, publish pool_link -> auv_vio_link TF for visualization/debugging

    # Frame names
    frame_id:
      global: pool_link # world frame for synchronized AUV poses and mapped objects
      auv: auv_link # official body frame; sensors/state estimation should own pool_link -> auv_link
      vio: auv_vio_link # debug-only VIO child frame published by vision when enabled
      camera_center: zed_camera_center # static camera mount frame under auv_link
      detection: zed_left_camera_frame # 3D detection frame used inside VisionDetectionFrame
      image: zed_left_camera_frame_optical # optical frame for image-like topics such as CameraInfo and debug feeds

    extrinsics:
      auv_to_camera_center:
        xyz: [0.148, 0.0, 0.0]
        rpy: [0.0, 0.0, 0.0]
      camera_center_to_detection:
        xyz: [0.0, 0.06, 0.0]
        rpy: [0.0, 0.0, 0.0]

    # Detection-time filters / heuristics
    filters:
      gate_top_crop: # Removes bottom X% of bounding box for gate to ignore legs/pool floor noise
        enable: true
        ratio: 0.50 # The ratio (0.0 to 1.0) of the gate bounding box to keep from the top edge
      border_exclusion: # Excludes objects that are too close to the border
        enable: false
        margin_px: 20 # The number of pixels to exclude from the border
        labels: ["gate"] # List of labels to apply border exclusion to

    debug_publish:
      camera_info: true # publish CameraInfo for the front camera feed using ZED left-camera intrinsics
      annotated:
        enable: true # publishes the front camera feed topic at detection_frame_topic + /annotated, toggled raw/annotated at runtime via service
        frequency: 1 # publish annotated image every N detection frames
      depth:
        enable: false # publish raw 32FC1 depth map image
        compressed: false # publish depth map as compressed 16-bit PNG
        frequency: 5 # publish depth image every N frames
    stream_ip: "127.0.1.1" # may be used by ZED ROS Wrapper or ZED SDK directly
    stream_port: 30000

    # Dataset collection
    collection:
      interval_seconds: 2.0 # seconds between saved frames when collection is active
      file_extension: ".png"
      image: 
        dir: front_cam_collection # directory for direct-to-disk RGB image saving (toggled via service)
      depth: 
        enable: true # flag to enable/disable depth saving
        dir: depth_collection # directory for direct-to-disk 16-bit millimeter depth saving
      enable_depth_collection: true # flag to enable/disable depth saving
    # Logging
    log_level: debug


down_cam_object_detection:
  ros__parameters:
    enable_object_detection: true
    topics: 
      image: /down_cam/image_raw # this will be the input topic if sim=true, this will be set to down_image_enhancement.ros__parameters.output_topic if enhance_images is set to true
      detection: /vision/down_cam/detections

    frame_id:
      camera: "sensors/down_cam"

    # Camera hardware (direct capture via cv2.VideoCapture, no usb_cam_node needed)
    # ELP-USB500W02M-AF60 (5MP OV5640, autofocus, 60° FOV)
    # Available MJPEG modes:   640x480@30  800x600@30  1024x768@30  1280x720@30  1280x1024@15  1600x1200@15  1920x1080@15  2592x1944@15
    # Available YUY2 modes:    640x480@30  800x600@30  1024x768@15  1280x720@7.5 1280x1024@7.5 1600x1200@3   1920x1080@3   2592x1944@3
    V4L2:
      video_device: "/dev/down_cam"
      fps: 30
      # V4L2 image controls (ELP OV5640)
      # Run `v4l2-ctl -d /dev/videoX --all` on the Jetson with the camera plugged in to verify ranges
      # v4l2-ctl --list-devices 
      # v4l2-ctl -d /dev/video2 --all
      # v4l2-ctl -d /dev/video2 --list-formats-ext
      image:
        width: 640
        height: 480
        brightness: 8              # [0..15]    default 8
        contrast: 8                # [0..15]    default 8
        saturation: 7              # [0..15]    default 7
        hue: 0                     # [-10..10]  default 0
        sharpness: 6               # [0..15]    default 6
        gamma: 7                   # [1..10]    default 7
        backlight_compensation: 0  # [0..1]     default 0
        power_line_frequency: 2    # 0=disabled 1=50Hz 2=60Hz; default 2
        white_balance:
          auto: false            # default true; when true, white_balance_temperature is ignored
          temperature: 4500      # [2800..6500] step 1; only used when auto_white_balance is false
        exposure:
          auto: 1                     # 1=Manual 3=Aperture Priority (auto); default 3
          time_absolute: 40           # [4..5000]  only used when auto_exposure is 1 (Manual); default 625
        focus:
          auto: false                    # default true; when true, focus_absolute is ignored
          absolute: 7                    # [0..21]    only used when auto_focus is false; default 16
    
    model:
      relative_path: models/local_rfdetr_onnx_test
      detection_threshold: 0.40
      # WARNING: These class names MUST be manually maintained when changing models to have new classes. 
      # You must also update the `class_names.txt` file in the model package.
      # A mismatch here can crash the vision node.
      class_names:
        - "gate"
        - "lane_marker"
        - "red_pipe"
        - "white_pipe"
        - "octagon"
        - "table"
        - "bin"
        - "board"
        - "survey_repair"
        - "search_rescue"
        - "compass"
        - "tools"
        - "lifebuoy"
        - "sos"
        - "ambulance"
        - "firetruck"
        - "blood"
        - "fire"
        - "bin_structure"
    qos:
      queue_size: 10
    debug_publish:
      annotated:
        enable: true
        frequency: 1
    collection:
      dir: down_cam_collection
      interval_seconds: 2.0
      file_extension: ".png"
    log_level: debug

object_map:
  ros__parameters:
    object_map_topic: /vision/object_map
    new_object_min_distance_threshold: 0.5 # distance in meters between a new detection and existing tracks to be considered a new object and start a new track
    large_structure_labels: ["gate", "table", "board", "bin_structure"]
    pipe_labels: ["red_pipe", "white_pipe"]
    min_large_structure_separation_m: 2.0 # minimum XY spacing required before placing gate/table/board/bin_structure near another confirmed large structure
    min_large_structure_pipe_separation_m: 1.0 # minimum XY spacing required before placing gate/table/board/bin_structure near a confirmed pipe

    # Feature Toggles (Game-Specific Constraints)
    enable_z_axis_locking: true # Forces specific unique objects to snap to pool floor/surface Z coordinates
    enable_gate_midpoint_refinement: true # Uses search_rescue/survey_repair panel detections to refine the gate pose
    enable_board_icon_refinement: true # Uses board icons to refine the board pose and make yaw face the AUV
    refinement_plausibility_radius: 5.0 # Max distance in meters for a refinement to be considered plausible
    # table_octagon_refinement_mode: 
    #   - none: no refinement
    #   - table_primary: publish octagon at table XY
    #   - octagon_primary: publish table at octagon XY
    #   - midpoint: publish both at shared midpoint XY
    table_octagon_refinement_mode: "midpoint" 
    max_pipe_distance: 7.0 # Truncates tracking of red/white pipes beyond this distance to reduce noise in map
    enable_pipe_distance_truncation: true # toggle the above truncation logic
    enable_lane_boundary: false # discard world-frame detections outside the competition lane AABB
    lane_x_min: -3.0 # back boundary (meters, world frame)
    lane_x_max: 25.0  # front boundary
    lane_y_min: -7.5 # right boundary
    lane_y_max: 7.5  # left boundary
    pool_floor_z: -2.1
    pool_surface_z: 0.0
    unique_objects: ["gate", "bin_structure", "table", "board", "octagon"]
    floor_objects: ["bin_structure", "table", "lane_marker", "board"]
    surface_objects: ["gate", "octagon"]

    max_per_class:
      gate: 1
      board: 1
      octagon: 1
      table: 1
      bin_structure: 1
      lane_marker: 2
      white_pipe: 6
      red_pipe: 3
      bin: 4
      search_rescue: 1
      survey_repair: 1
      compass: 1
      tools: 1
      lifebuoy: 1
      sos: 1
      ambulance: 1
      firetruck: 1
      blood: 1
      fire: 1

    # Tracker Parameters
    # relatively strict
    gating_threshold: 3.5 # Mahalanobis distance threshold (~3 sigma) for associating detections to tracks
    min_hits: 20 # Consecutive frames a detection must be matched to confirm a new track
    max_age: 8 # Number of frames to keep a lost track alive before deleting it
    max_position_jump: 2.0 # Maximum allowed distance (meters) between predictions and measurements
    conf_to_tent_threshold: 5 # Number of consecutive missed frames before a CONFIRMED track degrades to TENTATIVE
    tent_init_buffer: 5 # Extra frames allowed for a new TENTATIVE track to initialize before being deleted if unmatched
    
    # loose parameters
    # gating_threshold: 5.0
    # min_hits: 5
    # max_age: 15
    # max_position_jump: 4.0
    # conf_to_tent_threshold: 10
    # tent_init_buffer: 10

    # raw detection parameters
    # gating_threshold: 99.0
    # min_hits: 1
    # max_age: 1
    # max_position_jump: 99.0
    # conf_to_tent_threshold: 1
    # tent_init_buffer: 1

    # Debug
    log_level: warn

      

front_image_enhancement:
  ros__parameters:
    output_topic: /vision/front_cam/image_enhanced
    queue_size: 10
    log_level: "warn"

down_image_enhancement:
  ros__parameters:
    output_topic: /vision/down_cam/image_enhanced
    queue_size: 10
    log_level: "warn"