attitude_controller:
    ros__parameters:
        control_loop_rate: 10.0
        # P
        P_ex: 18.5757
        P_ey: 24.1017
        P_ez: 18.2613
        # I
        I_ex: 9.5866
        I_ey: 8.1387
        I_ez: 1.9170
        # D
        P_wx: 4.0088
        P_wy: 5.6824
        P_wz: 4.4644
        I_MAX: 3.0
        integral_activation_threshold_deg: 5.0
        max_slew_rate_roll_deg: 45.0 # [deg/s] (0.0 = disabled)
        max_slew_rate_pitch_deg: 45.0 # [deg/s]
        max_slew_rate_yaw_deg: 45.0 # [deg/s]
        buoyancy: 264.09 # [N]
        r_bv_v: [ 0.0, 0.0, 0.0 ] # [m] From CAD Model    
        enabled: true

