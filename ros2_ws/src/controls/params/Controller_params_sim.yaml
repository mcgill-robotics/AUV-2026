superimposer:
    ros__parameters:
        effort_bias_force_x: 0.0
        effort_bias_force_y: 0.0
        effort_bias_force_z: 0.0
        effort_bias_torque_x: 0.0
        effort_bias_torque_y: 0.0
        effort_bias_torque_z: 0.0
        publish_hz: 40.0
        # Safety Effort Limits (0.0 = disabled)
        max_planar_effort: 30.0      # Max magnitude of sqrt(Fx^2 + Fy^2) [N]
        max_depth_effort: 40.0       # Max absolute vertical force [N]
        max_torque_x: 10.0           # Max absolute roll torque [Nm]
        max_torque_y: 10.0           # Max absolute pitch torque [Nm]
        max_torque_z: 10.0           # Max absolute yaw torque [Nm]
        enabled: true
