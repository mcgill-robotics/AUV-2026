# Automated PID Tuner Configuration for CMA-ES (SITL Pipeline)
# All algorithm parameters and cascaded schedule modes are defined here to keep scripts clean.

cmaes_tuner:
  ros__parameters:
    # General CMA-ES algorithm settings
    popsize: 8
    maxiter: 15
    sim_duration_sec: 15.0
    randomize_setpoints: true
    
    # Cost function weights and penalty thresholds
    weight_effort: 0.002
    overshoot_threshold: 0.02
    overshoot_floor_deg: 2.0
    overshoot_floor_meters: 0.1
    overshoot_penalty_base: 5000.0

    # Cascaded tuning schedule mode definitions
    # Note on Setpoint Units:
    # - Attitude controllers (pitch, roll, yaw): Setpoint ranges are in DEGREES (°) representing target angle displacement.
    # - Translational controllers (depth, surge, sway, full): Setpoint ranges are in METERS (m) representing target distance.
    modes:
      pitch:
        target_controller: "/attitude_controller"
        param_name_kp: "P_ey"
        param_name_ki: "I_ey"
        param_name_kd: "P_wy"
        state_topic: "auv_frame/imu"
        effort_topic: "/controls/attitude_effort"
        effort_axis: "torque_y"
        setpoint_topic: "/controls/quaternion_setpoint"
        auxiliary_controllers: []
        # Units: DEGREES (°)
        default_setpoint: 15.0
        setpoint_min: -180.0
        setpoint_max: 180.0
        init_sigma: 3.0

      roll:
        target_controller: "/attitude_controller"
        param_name_kp: "P_ex"
        param_name_ki: "I_ex"
        param_name_kd: "P_wx"
        state_topic: "auv_frame/imu"
        effort_topic: "/controls/attitude_effort"
        effort_axis: "torque_x"
        setpoint_topic: "/controls/quaternion_setpoint"
        auxiliary_controllers: []
        # Units: DEGREES (°)
        default_setpoint: 10.0
        setpoint_min: -180.0
        setpoint_max: 180.0
        init_sigma: 3.0

      yaw:
        target_controller: "/attitude_controller"
        param_name_kp: "P_ez"
        param_name_ki: "I_ez"
        param_name_kd: "P_wz"
        state_topic: "auv_frame/imu"
        effort_topic: "/controls/attitude_effort"
        effort_axis: "torque_z"
        setpoint_topic: "/controls/quaternion_setpoint"
        auxiliary_controllers: []
        # Units: DEGREES (°)
        default_setpoint: 30.0
        setpoint_min: -180.0
        setpoint_max: 180.0
        init_sigma: 3.0

      depth:
        target_controller: "/depth_controller"
        param_name_kp: "KP"
        param_name_ki: "KI"
        param_name_kd: "KD"
        state_topic: "auv_frame/depth"
        effort_topic: "/controls/depth_effort"
        effort_axis: "force_z"
        setpoint_topic: "/controls/depth_setpoint"
        auxiliary_controllers: ["/attitude_controller"]
        # Units: METERS (m)
        default_setpoint: 2.0
        setpoint_min: 0.5
        setpoint_max: 4.5
        init_sigma: 15.0

      surge:
        target_controller: "/x_controller"
        param_name_kp: "KP"
        param_name_ki: "KI"
        param_name_kd: "KD"
        state_topic: "auv_frame/dvl/position"
        effort_topic: "/controls/x_effort"
        effort_axis: "force_x"
        setpoint_topic: "/controls/x_setpoint"
        auxiliary_controllers: ["/attitude_controller", "/depth_controller"]
        # Units: METERS (m)
        default_setpoint: 5.0
        setpoint_min: 2.5
        setpoint_max: 8.5
        init_sigma: 10.0

      sway:
        target_controller: "/y_controller"
        param_name_kp: "KP"
        param_name_ki: "KI"
        param_name_kd: "KD"
        state_topic: "auv_frame/dvl/position"
        effort_topic: "/controls/y_effort"
        effort_axis: "force_y"
        setpoint_topic: "/controls/y_setpoint"
        auxiliary_controllers: ["/attitude_controller", "/depth_controller"]
        # Units: METERS (m)
        default_setpoint: 5.0
        setpoint_min: 2.5
        setpoint_max: 10.0
        init_sigma: 10.0

      full:
        target_controller: "multi"
        is_multi_controller: true
        auxiliary_controllers: []
        # Translational Setpoints [Surge X, Sway Y, Depth Z]: METERS (m)
        default_setpoint: [5.0, 5.0, 2.0]
        setpoint_min: [-7.0, -2.0, 1.5]
        setpoint_max: [7.0, 2.0, 4.5]
        # Angular Setpoints [Roll, Pitch, Yaw]: DEGREES (°)
        default_angular_setpoint: [10.0, 10.0, 30.0]
        angular_setpoint_min: [-10.0, -10.0, -180.0]
        angular_setpoint_max: [10.0, 10.0, 180.0]
        init_sigma: 1.5

