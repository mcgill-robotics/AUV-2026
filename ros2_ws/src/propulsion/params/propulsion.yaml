thrust_mapper:
  ros__parameters:
    # Maximum thrust values that can be commanded for each thruster (in Newtons)
    max_thrust_t1: 28.45
    max_thrust_t2: 28.45
    max_thrust_t3: 28.45
    max_thrust_t4: 28.45
    max_thrust_t5: 28.45
    max_thrust_t6: 28.45
    max_thrust_t7: 28.45
    max_thrust_t8: 28.45

    # Minimum thrust values that can be commanded for each thruster (in Newtons)
    min_thrust_t1: -20.0
    min_thrust_t2: -20.0
    min_thrust_t3: -20.0
    min_thrust_t4: -20.0
    min_thrust_t5: -20.0
    min_thrust_t6: -20.0
    min_thrust_t7: -20.0
    min_thrust_t8: -20.0

    # Thruster PWM limits in microseconds
    thruster_PWM_lower_limit: 1196
    thruster_PWM_upper_limit: 1804

    # Safety
    watchdog_timeout_sec: 2.0   # Reset thrusters if no wrench received for this long
    arming_delay_sec: 1.0       # Seconds to wait before accepting wrench commands

    # Geometric parameters for thruster positions (in meters). Consult README for details.
    a: 0.064399       # [m]
    b: 0.216983       # [m]
    c: 0.155022       # [m]
    d: 0.262459       # [m]
    e: -0.001603      # [m]
    alpha: 45.0       # [deg]
    dx: -0.001732     # [m]
    dy: 0.004523      # [m]