planner_root_tree:
  ros__parameters:
    tick_rate       : 3.0
    sim             : false
    use_ground_truth: false

    pre_qual:
      yaw_tolerance: 0.5         # (rad) TODO: convert to deg for consistency
      positional_tolerance: 0.3  # (m)
      hold_time: 1.0             # (s)
      timeout: 20.0              # (s)

      orbit:
        yaw_tolerance_scale: 0.5
        positional_tolerance_scale: 0.5
        hold_time_initial: 1.0
        hold_time_segments: 0.2
        timeout: 30.0

    slalom:
      num_layers: 3                # Number of pipe layers to navigate
      gate_side: "right"           # Default fallback side if /gate/side is not on the blackboard (set by GateTask at runtime)
      scan_angle_deg: 60.0         # (deg) Angle to sweep left/right during pipe scan
      scan_pause_time: 1.0         # (s) Seconds to pause after each scan rotation
      collinearity_threshold: 0.5  # (m) Max perpendicular distance for pipe triplet matching
      min_forward_dist: 0.5        # (m) Min forward distance to consider pipe as "in front"
      layer_distance: 2.0          # (m) Distance between pipe layers
      initial_depth: -1.0          # (m) Depth for the initial dive before slalom
      position_tolerance: 0.3      # (m) Position convergence threshold for gap navigation
      yaw_tolerance_deg: 17.0      # (deg) Yaw convergence threshold for gap navigation
      hold_time: 0.5               # (s) Seconds to hold within tolerance before SUCCESS
      timeout: 45.0                # (s) Seconds before gap navigation FAILURE
      scan_yaw_tolerance_deg: 30.0 # (deg) Yaw tolerance for scan/sweep turn steps
      scan_hold_time: 0.1          # (s) Hold time before scan turn step SUCCESS
      scan_timeout: 30.0           # (s) Timeout before scan turn step FAILURE

    bins:
      downcam_fov_horizontal: 59.7        # (deg) Horizontal FOV of down cam while in water
      downcam_fov_vertical: 47.6          # (deg) Vertical FOV of down cam while in water
      downcam_image_width: 640            # (px) Width of down cam image
      downcam_image_height: 480           # (px) Height of down cam image
      search_sweep_steps: 8               # (steps) Number of steps to take when doing the search sweep for the bin structure and for the bins themselves
      search_sweep_step_timeout: 0.5      # (s) Seconds to wait at each step of the search sweep for the bin structure and for the bins
      bin_moving_average_weight: 1.0      # (0-1) Weight of current measurement against previous position for moving average
                                          # (0=useless never moves, 1=only current measurement)
      bin_structure_distance: 2.0         # (m) How far away to go from the bin structure to look at it with frontcam to see the bins
      go_above_bin_structure_height: 0.5  # (m) Height above bin structure when looking at it with frontcam to see the bins
      go_above_bin_height: 0.7            # (m) Height above bin to move to before aligning with downcam
      switch_sides_height: 1.2            # (m) Height above bin structure when switching sides to look at the other bins
      wrong_task_type_threshold: 5        # (frames) Difference in number of frames where wrong icon and right icon were detected before deciding its the wrong task
      task_completion_threshold: 5        # (frames) Number of frames where the correct icon was detected before dropping the marker
      bin_lined_up_threshold: 10          # (pixels) How close the center of the bin needs to be to the center of the image to be considered "lined up" for dropping the marker
      num_required_markers: 2             # (markers) Number of markers that need to be dropped in the correct bins to complete the task
      num_bins: 4                         # (bins) Total number of bins in the bin structure
      bins_to_bin_structure: 0.3          # (m) Approximate distance from center of bin structure to the bins
      force_fallback_search: False         # (bool) Force behavior to look for bins instead of bin structure first
      force_fallback_alignment: False      # (bool) Force behavior to use bins for projection instead of bin structure
