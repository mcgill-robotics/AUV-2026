name: Simulation Integration Tests

on:
  push:
    branches: [ "main", "dev/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  simulation-test:
    name: Test the simulation ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
        fail-fast: false
        matrix:
          include:
            - name: windows
              runner: windows-2026
              context: .
              sim_binary: StandaloneWindows64
              suffix: amd64
            - name: linux
              runner: ubuntu-24.04
              context: .
              sim_binary: StandaloneLinux64
              suffix: amd64
            - name: mac-arm
              runner: macos-26
              context: .
              sim_binary: StandaloneOSX
              suffix: arm64


    permissions:
        contents: read
        packages: write
        actions: read
        pull-requests: write

    steps:
        # -------------------------------------------------------------
        # 1. Prep the environment by setting data collection and clear space
        # -------------------------------------------------------------
      - name: Collect Workflow Telemetry
        uses: ycfreeman/workflow-telemetry-action@v3.0.2
        with:
            job_summary: true
            comment_on_pr: false
            theme: light
            proc_trace_chart_show: false
            proc_trace_table_show: false
      
      - name: Checkout AUV Repository
        uses: actions/checkout@v6
        with:
          fetch-tags: true
          submodules: recursive
          lfs: true
        
      - name: Add swapfile
        uses: ./.github/actions/swapfile

      - name: Clean up disk space
        uses: ./.github/actions/cleanup_disk

        # -------------------------------------------------------------
        # 2. Get the pre-built binary from auv-sim-unity repository
        # ------------------------------------------------------------- 
      - name: Download pre-built Unity AUV sim binary 
        shell: bash # Always use bash no matter the platform to ensure all commands are same
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the latest release tag from the auv-sim-unity repository
          mkdir -p sim_binary
          echo "Fetching latest release tag from auv-sim-unity repository matching platform..."
          gh release download v1.0.0 \
            --repo mcgill-robotics/auv-sim-unity \
            --pattern "auv-sim-${{ matrix.sim_binary }}.zip" \
            --dir sim_binary

          # Extract the downloaded zip file
          echo "Extracting the downloaded zip file..."
          unzip -q sim_binary/auv-sim-${{ matrix.sim_binary }}.zip -d sim_binary/
          
          # To ensure the binary is executable, we can set the permissions (especially for Linux and macOS)
          if [[ "${{ matrix.runner }}" == "ubuntu-24.04" ]]; then
            chmod +x sim_binary/${{ matrix.sim_binary }}/auv-sim.x86_64
          elif [[ "${{ matrix.runner }}" == "macos-26" ]]; then
            xattr -cr sim_binary/auv-sim-mac/${{ matrix.sim_binary }}/auv-sim.app
          fi # Windows binaries are typically executable by default, so no need to change permissions.

      # -------------------------------------------------------------
      # 3. Setup virtual display for Linux and macOS runners (if needed)
      # ------------------------------------------------------------- 
      - name: Setup virtual display for Linux, macOS and Windows already have dependencies built-in
        run: |
          if [[ "${{ matrix.runner }}" == "ubuntu-24.04" ]]; then
            echo "Setting up virtual display for Linux..."
            sudo apt-get update
            sudo apt-get install -y \
              xvfb \
              libgl1 \
              libglx-mesa0 \
              libgl1-mesa-dri \
              libglu1-mesa \
              netcat-openbsd
          fi
      
      # -------------------------------------------------------------
      # 4. Pull and launch Docker containers for ROS2 and the simulation environment
      # ------------------------------------------------------------- 
      - name: Launch Docker containers and ROS TCP
        run: |
          echo "Pulling and launching Docker containers..."
          if [[ "${{ matrix.runner }}" == "ubuntu-24.04" || "${{ matrix.runner }}" == "windows-2026" ]]; then
            image=mcgillrobotics/auv_2026:latest-nvidia-amd64
          elif [[ "${{ matrix.runner }}" == "macos-26" ]]; then
            image=mcgillrobotics/auv_2026:latest-arm64
          fi

          docker run -d \
            --name ros2-sim \
            --network host \
            --ipc host \
            --privileged \
            -e ROS_DOMAIN_ID=0 \
            -e CI=true \
            -e RMW_IMPLEMENTATION=rmw_fastrtps_cpp \
            -v ${{ github.workspace }}:/home/douglas/AUV \
            -w /home/douglas/AUV \
            $image \
            tail -f /dev/null

      - name: Set workspace permissions
        run: |
          docker exec -u 0 ros2-sim chown -R douglas:douglas /home/douglas/AUV/ros2_ws
      # -------------------------------------------------------------
      # 5. Build aaaalll our ros2 packages
      # ------------------------------------------------------------- 
      - name: Build all packages 
        run: |
          echo "Building all packages in the ROS2 workspace..."
          docker exec -i ros2-sim bash -c \
            "./build.sh -c"
      
      # -------------------------------------------------------------
      # 6. Start the simulation
      # ------------------------------------------------------------- 
      - name: Start the sim
        run: |
          # 1920x1080 24-bit screen
          xvfb-run --auto-servernum --server-args "-screen 0 1920x1080x24" \
            ./sim_binary/${{ matrix.sim_binary }}/auv-sim.x86_64 \
            -batchmode -logfile ./sim.log &
          
          echo "Running sim"
          echo "SIM_PID=$!" >> $GITHUB_ENV
        
      # -------------------------------------------------------------
      # 7. Launch the ROS2 tcp endpoint and look for topics
      # ------------------------------------------------------------- 
      - name: Launch ROS2 TCP endpoint
        run: |
          echo "Launching ROS2 TCP endpoint..."
          docker exec -d ros2-sim bash -c \
          "source /opt/ros/jazzy/setup.bash && \
          source /home/douglas/AUV/ros2_ws/install/setup.bash &&
          ros2 launch bringup bringup.launch.py sim:=true"

          echo "Waiting a few seconds for the nodes to initialize and bind the TCP socket"
          sleep 7
      
      - name: Diagnose ROS TCP Endpoint
        shell: bash
        run: |
          echo "Checking TCP port 10000..."
          sudo ss -ltnp | grep ':10000 ' || echo "Nothing listening on port 10000"

          echo "Checking ROS 2 launch logs..."
          docker exec ros2-sim \
            cat /home/douglas/AUV/ros2_launch.log || true
            
      - name: Wait for ROS TCP Endpoint (Port 10000)
        shell: bash
        run: |
          echo "Waiting for port 10000 to open..."

          for i in {1..45}; do
            if nc -z 127.0.0.1 10000 2>/dev/null; then
              echo "ROS TCP Endpoint is listening on port 10000!"
              exit 0
            fi

            sleep 1
          done
          
      - name: Wait for ROS2 topics to be available
        run: |
          echo "Waiting for unity to build the ros2 topics graph"
          sleep 15

          echo "Checking for /imu/data topic..."
          docker exec -i ros2-sim bash -c \
          'source /opt/ros/jazzy/setup.bash && \
          source /home/douglas/AUV/ros2_ws/install/setup.bash && \
          for i in {1..10}; do
            if timeout 3s ros2 topic echo /imu/data --once > /dev/null 2>&1; then
              echo "IMU topic detected and publishing!"
              ros2 topic echo /imu/data --once
              exit 0
            fi
            echo "Retrying... ($i/10)"
            sleep 1
          done
          exit 1'

      # -------------------------------------------------------------
      # 8. Cleanup: Stop the simulation and ROS2 containers
      # ------------------------------------------------------------- 
      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up..."
          docker stop ros2-sim || true
          docker rm ros2-sim || true
          if [[ -n "${SIM_PID}" ]]; then
            kill $SIM_PID || true
          fi