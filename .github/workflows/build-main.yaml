name: ROS2 Build and Test

on:
  push:
    branches: [ "main", "pooltest/*", "dev/*" ]
  pull_request:
    branches: [ "main", "pooltest/*" ]
  workflow_dispatch:

jobs:
  colcon-build-dev:
    runs-on: ubuntu-22.04-arm
    
    # GitHub natively handles pulling the image and mounting the workspace here
    container:
      image: mcgillrobotics/auv_2026:dev-jetson
      options: --user root
      # authenticate to DockerHub to avoid rate limits
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true

    # we are not pushing so login is not necessary, github automatically pulls the image for us when we specify it in the container section above
    # - name: Login to DockerHub
    #   uses: docker/login-action@v3
    #   with:
    #     username: ${{ vars.DOCKERHUB_USERNAME }}
    #     password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build packges from scratch
      run: |
          /bin/bash -c "./build.sh -c"

    - name: Build in offline mode
      run: |
          /bin/bash -c "./build.sh -co"
    
    - name: Archive build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.package_group.name }}
        path: |
          ros2_ws/build/
          ros2_ws/install/
          ros2_ws/log/
        retention-days: 7

  # Job that summarizes the build results
  build-summary:
    if: always()
    needs: colcon-build-dev
    runs-on: ubuntu-22.04-arm
    
    steps:
    - name: Check build results
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Colcon build
        if [ "${{ needs.colcon-build-dev.result }}" != "skipped" ]; then
          echo "- ROS2 Dev Build: ${{ needs.colcon-build-dev.result }}" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Workflow completed at $(date)" >> $GITHUB_STEP_SUMMARY
