name: ROS2 Build and Test

on:
  push:
    branches: [ "main", "pooltest/*", "dev/*" ]
  pull_request:
    branches: [ "main", "pooltest/*" ]
  workflow_dispatch:

jobs:
  find-packages:
    runs-on: ubuntu-22.04 # Standard runner is fine here, saves ARM minutes
    outputs:
      packages: ${{ steps.list.outputs.packages }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-tags: true
        submodules: recursive
        lfs: true

    # we do not need the docker container for this step, so we can install native colcon to list packages
    # avoids pulling the image for both discovering and building packages
    - name: Install native colcon
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip jq
        pip3 install colcon-common-extensions

    - name: Discover ROS2 packages
      id: list
      run: |
        cd ros2_ws
        # Native colcon parses the package.xml files without needing ROS sourced
        PACKAGES=$(colcon list --names-only 2>/dev/null)
        
        # Convert to JSON array
        JSON=$(echo "$PACKAGES" | grep -v '^\s*$' | jq -R . | jq -sc .)
        echo "packages=$JSON" >> $GITHUB_OUTPUT
        echo "Discovered packages: $JSON"

  colcon-build-dev:
    needs: find-packages
    runs-on: ubuntu-22.04-arm
    
    # GitHub natively handles pulling the image and mounting the workspace here
    container:
      image: mcgillrobotics/auv_2026:dev-jetson
      options: --user root
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # authenticate to DockerHub to avoid rate limits
    strategy:
      fail-fast: false # Keep building other packages even if one fails
      matrix:
        package: ${{ fromJSON(needs.find-packages.outputs.packages) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true

    # we are not pushing so login is not necessary, github automatically pulls the image for us when we specify it in the container section above
    # - name: Login to DockerHub
    #   uses: docker/login-action@v3
    #   with:
    #     username: ${{ vars.DOCKERHUB_USERNAME }}
    #     password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Test Package
      run: |
          bash -c "
            set -e
            
            # Source ROS2 environment
            source /opt/ros/\$ROS_DISTRO/setup.bash
            
            # Navigate to ROS2 workspace
            cd ros2_ws
            
            # Install dependencies using rosdep
            apt-get update
            rosdep update --rosdistro \$ROS_DISTRO
            rosdep install --from-paths src --ignore-src --rosdistro \$ROS_DISTRO -y || true
            
            # Build specified packages
            echo 'Building packages: ${{ matrix.package }}'
            colcon build \
              --packages-up-to ${{ matrix.package }} \
              --event-handlers console_direct+ \
              --parallel-workers \$(nproc)
            
            # Source the built packages
            source install/setup.bash
          "
    
    - name: Archive build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.package_group.name }}
        path: |
          ros2_ws/build/
          ros2_ws/install/
          ros2_ws/log/
        retention-days: 7

  # Job that summarizes the build results
  build-summary:
    if: always()
    needs: colcon-build-dev
    runs-on: ubuntu-22.04-arm
    
    steps:
    - name: Check build results
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Colcon build
        if [ "${{ needs.colcon-build-dev.result }}" != "skipped" ]; then
          echo "- ROS2 Dev Build: ${{ needs.colcon-build-dev.result }}" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Workflow completed at $(date)" >> $GITHUB_STEP_SUMMARY
