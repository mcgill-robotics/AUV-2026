name: ROS2 Build and Test

on:
  push:
    branches: [ "main", "pooltest/*", "dev/*" ]
  pull_request:
    branches: [ "main", "pooltest/*" ]
  workflow_dispatch:

jobs:
  find-packages:
    runs-on: ubuntu-22.04-arm
    outputs:
      packages: ${{ steps.list.outputs.packages }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-tags: true
        submodules: recursive
        lfs: true

    - name: Discover ROS2 packages
      id: list
      run: |
        # Run colcon list inside the dev container to get all buildable packages
        PACKAGES=$(docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace/ros2_ws \
          mcgillrobotics/auv_2026:dev-arm64 \
          bash -c "source /opt/ros/\$ROS_DISTRO/setup.bash && colcon list --names-only 2>/dev/null")

        # Convert newline-separated names to a JSON array for the matrix
        JSON=$(echo "$PACKAGES" | grep -v '^\s*$' | jq -R . | jq -sc .)
        echo "packages=$JSON" >> $GITHUB_OUTPUT
        echo "Discovered packages: $JSON"

  colcon-build-dev:
    needs: find-packages
    runs-on: ubuntu-22.04-arm

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.find-packages.outputs.packages) }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-tags: true
        submodules: recursive
        lfs: true

    # we are not pushing and mcgillrobotics/auv_2026 is a public image, so no login needed    
    # - name: Login to DockerHub
    #   if: github.ref == 'refs/heads/main'
    #   uses: docker/login-action@v3
    #   with:
    #     username: ${{ vars.DOCKERHUB_USERNAME }}
    #     password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Determine packages to build
      id: packages
      run: |
        echo "packages=${{ matrix.package_group.packages }}" >> $GITHUB_OUTPUT
    
    - name: Run colcon build in container
      run: |
        docker run --rm \
          --user $(id -u):$(id -g) \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          mcgillrobotics/auv_2026:dev-arm64 \
          bash -c "
            set -e
            
            # Source ROS2 environment
            source /opt/ros/\$ROS_DISTRO/setup.bash
            
            # Navigate to ROS2 workspace
            cd ros2_ws
            
            # Install dependencies using rosdep
            sudo apt-get update
            sudo rosdep update --rosdistro \$ROS_DISTRO
            sudo rosdep install --from-paths src --ignore-src --rosdistro \$ROS_DISTRO -y || true
            
            # Build specified packages
            echo 'Building packages: ${{ steps.packages.outputs.packages }}'
            colcon build \
              --packages-select ${{ steps.packages.outputs.packages }} \
              --event-handlers console_direct+ \
              --parallel-workers \$(nproc)
            
            # Source the built packages
            source install/setup.bash
          "
    
    - name: Archive build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.package_group.name }}
        path: |
          ros2_ws/build/
          ros2_ws/install/
          ros2_ws/log/
        retention-days: 7

  # Job that summarizes the build results
  build-summary:
    if: always()
    needs: colcon-build-dev
    runs-on: ubuntu-22.04-arm
    
    steps:
    - name: Check build results
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Colcon build
        if [ "${{ needs.colcon-build-dev.result }}" != "skipped" ]; then
          echo "- ROS2 Dev Build: ${{ needs.colcon-build-dev.result }}" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Workflow completed at $(date)" >> $GITHUB_STEP_SUMMARY
